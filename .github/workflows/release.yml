# Builds the Windows and Linux packages on each platform's own runner and
# attaches them to a DRAFT release, so nothing is public until you publish it.
# Push a tag (git tag v0.2.0 && git push origin v0.2.0) or run it by hand.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One release build per tag at a time; pushing the same tag again replaces the old run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            # latest.yml and the blockmap are what installed copies read to update themselves.
            files: |
              app/release/*.exe
              app/release/*.exe.blockmap
              app/release/latest.yml
          - os: ubuntu-latest
            script: dist:linux
            files: |
              app/release/*.AppImage
              app/release/*.deb
              app/release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    # A normal build takes about 7 minutes. Fail a stuck one instead of letting it
    # sit for days (v0.4.0's first run never started and had to be pushed again).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Unit tests on Electron's own Node (settings, kubeconfig handling).
      - run: npm run test:unit
      - run: npm run ${{ matrix.script }}
        env:
          # No code signing yet: keep electron-builder from looking for certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: tender-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.exe *.AppImage *.deb > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Tender $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
