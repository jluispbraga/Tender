name: Feature request
description: Something Tender could do that it does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job, not the solution. "I want to see why a pod restarted" is more useful than "add a button".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: The command, the other tool, or the workaround.
  - type: textarea
    id: idea
    attributes:
      label: What would you like Tender to do?
